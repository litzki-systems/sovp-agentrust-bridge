name: conformance

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest + TRACE Level 0 (py${{ matrix.python-version }}, ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # "tested" pins the versions named in integration.yaml; "latest" takes
        # whatever PyPI resolves today, so upstream changes show up early.
        stack: ["tested", "latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./integrations/litzki-sovp pytest
          if [ "${{ matrix.stack }}" = "tested" ]; then
            python -m pip install "agentrust-trace==0.10.0" "agentrust-trace-tests==0.5.1"
          fi
          python -m pip show agentrust-trace agentrust-trace-tests | grep -E "^(Name|Version)"

      - name: Unit tests
        run: python -m pytest integrations/litzki-sovp/tests -q

      - name: Generate a signed TRACE record
        run: |
          # Throwaway per-run signing key; never committed. See the package README.
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/ed25519-private.pem"
          litzki-sovp-trace \
            --input integrations/litzki-sovp/examples/sovp-attestation.json \
            --private-key "$RUNNER_TEMP/ed25519-private.pem" \
            --output "$RUNNER_TEMP/sovp.trace.json"

      - name: TRACE conformance (Level 0)
        run: trace-tests verify --record "$RUNNER_TEMP/sovp.trace.json" --level 0

      - name: Record carries the SOVP document reference
        run: |
          python - "$RUNNER_TEMP/sovp.trace.json" integrations/litzki-sovp/examples/sovp-attestation.json <<'PY'
          import hashlib, json, sys, rfc8785
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          doc = json.load(open(sys.argv[2], encoding="utf-8"))["sovp_attestation_document"]
          expected = "sha256:" + hashlib.sha256(rfc8785.dumps(doc)).hexdigest()
          assert record["references"][0]["digest"] == expected, record["references"]
          print("references[0].digest", expected)
          PY
