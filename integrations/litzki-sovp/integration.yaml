name: litzki-sovp
vendor: Litzki Systems
product: SOVP
version: 0.1.0
category: attestation
summary: Emits signed AgenTrust TRACE records from SOVP attestation results.
maintainer:
  name: Litzki Systems
  email: maintainers@litzki.systems
links:
  homepage: https://github.com/litzki-systems/sovp-agentrust-bridge
  repository: https://github.com/litzki-systems/sovp-agentrust-bridge
runtime:
  language: python
  package: litzki-sovp-agentrust-bridge
  requires_python: '>=3.11'
  dependencies:
    - cmcp-runtime
    - agentrust-trace
    - agentrust-trace-tests
    - agent-manifest
capabilities:
  emits:
    - trace-record
  consumes:
    - sovp-attestation-result
claims:
  tier: community
  trace_conformance: level-0
  verified: true
notes:
  - Generated records pass agentrust-trace-tests at Level 0 (TR-ENV, TR-SIG, TR-POL). Reproduce with `trace-tests verify --record <record> --level 0`.
  - Level 0 is the honest ceiling for this bridge. It transcribes a SOVP attestation rather than measuring a hardware TEE, so runtime.platform is software-only, which the suite accepts only at Level 0.
  - verified means this repository's CI runs that reproduction on every push and pull request (.github/workflows/ci.yml, Python 3.11 and 3.12). It attests Level-0 conformance only; it is not an endorsement by the AgenTrust maintainers.
